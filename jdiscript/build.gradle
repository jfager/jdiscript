plugins {
    id 'maven-publish'
    id 'signing'
}

// On Java 9+, JDI lives in the jdk.jdi module instead of tools.jar
if (JavaVersion.current().isJava9Compatible()) {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['--add-modules', 'jdk.jdi']
    }
} else {
    dependencies {
        implementation files("${System.properties['java.home']}/../lib/tools.jar")
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'jdiscript'
                packaging = 'jar'
                description = 'A scripting wrapper for the Java Debugger Interface'
                url = 'https://github.com/jfager/jdiscript'

                scm {
                    connection = 'scm:git:git://github.com/jfager/jdiscript.git'
                    developerConnection = 'scm:git:ssh://github.com:jfager/jdiscript.git'
                    url = 'https://github.com/jfager/jdiscript/tree/master'
                }

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'jfager'
                        name = 'Jason Fager'
                        email = 'jfager@gmail.com'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = 'ossrh'
            def releasesUrl = uri("https://oss.sonatype.org/service/local/staging/deploy/maven2/")
            def snapshotsUrl = uri("https://oss.sonatype.org/content/repositories/snapshots/")
            url = version.toString().endsWith('SNAPSHOT') ? snapshotsUrl : releasesUrl
            credentials {
                username = findProperty('ossrhUsername') ?: ''
                password = findProperty('ossrhPassword') ?: ''
            }
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}
